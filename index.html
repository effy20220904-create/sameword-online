<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>同词相遇</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:480px;margin:30px auto;padding:0 16px}
.box{border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
button{padding:10px 16px;background:#3b82f6;color:white;border:none;border-radius:8px;cursor:pointer}
#tip{color:#666}
</style>
</head>
<body>
<h2>同词相遇</h2>
<div class="box">
  <div>房间号</div>
  <input id="roomId" placeholder="随便填数字，比如1234" value="1234">
  <div>我是玩家</div>
  <input type="radio" name="p" value="1" checked>玩家1
  <input type="radio" name="p" value="2">玩家2
</div>
<div class="box">
  <input id="wordInput" placeholder="输入词语">
  <button onclick="submitWord()">提交</button>
  <div id="tip"></div>
</div>
<div class="box">
  <div>玩家1：<span id="p1">--</span></div>
  <div>玩家2：<span id="p2">--</span></div>
</div>

<script>
let roomIdEl = document.getElementById('roomId');
let wordInput = document.getElementById('wordInput');
let tip = document.getElementById('tip');
let p1El = document.getElementById('p1');
let p2El = document.getElementById('p2');

function getPlayer(){
  return document.querySelector('input[name="p"]:checked').value;
}

async function submitWord(){
  const rid = roomIdEl.value.trim();
  const w = wordInput.value.trim();
  const p = getPlayer();
  if(!rid || !w) return tip.innerText="填写房间和词语";
  tip.innerText="提交中...";
  const res = await fetch(`/api/room?roomId=${rid}`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({word:w,player:p})
  });
  const data = await res.json();
  render(data);
  tip.innerText="已提交";
}

async function poll(){
  const rid = roomIdEl.value.trim();
  if(!rid) return;
  const res = await fetch(`/api/room?roomId=${rid}`);
  const data = await res.json();
  render(data);
}
function render(d){
  p1El.innerText = d.p1||"--";
  p2El.innerText = d.p2||"--";
  if(d.p1 && d.p2 && d.p1 === d.p2){
    tip.innerText="🎉 同词相遇！";
  }
}
setInterval(poll,1200);
</script>
</body>
</html>
